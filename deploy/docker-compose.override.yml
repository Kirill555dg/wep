version: '3.8'

services:
  backend:
    environment:
      # Ensure backend allows requests from nginx (localhost) and vite dev server
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:5173"]'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: wep_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
    ports:
      # Exposed for direct vite-dev access (optional, nginx is the main entry)
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend
    networks:
      - wep_network

  nginx:
    image: nginx:alpine
    container_name: wep_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - wep_network
