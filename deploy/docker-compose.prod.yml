services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: wep_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network
