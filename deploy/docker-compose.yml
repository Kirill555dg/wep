services:
  postgres:
    image: postgres:16-alpine
    container_name: wep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wep_password}
      POSTGRES_DB: ${POSTGRES_DB:-wep_education}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wep_user} -d ${POSTGRES_DB:-wep_education}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  minio:
    image: minio/minio:latest
    container_name: wep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wep_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wep_user}:${POSTGRES_PASSWORD:-wep_password}@postgres:5432/${POSTGRES_DB:-wep_education}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wep-media}
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8023/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  wep_network:
    driver: bridge
