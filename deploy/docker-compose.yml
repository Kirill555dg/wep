version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wep_password}
      POSTGRES_DB: ${POSTGRES_DB:-wep_education}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wep_user} -d ${POSTGRES_DB:-wep_education}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  redis:
    image: redis:7-alpine
    container_name: wep_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wep_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wep_user}:${POSTGRES_PASSWORD:-wep_password}@postgres:5432/${POSTGRES_DB:-wep_education}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8023:8023"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wep_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting application...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8023
      "

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: wep_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wep_network

volumes:
  postgres_data:
    driver: local

networks:
  wep_network:
    driver: bridge
