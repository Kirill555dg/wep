version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wep_password}
      POSTGRES_DB: ${POSTGRES_DB:-wep_education}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wep_user} -d ${POSTGRES_DB:-wep_education}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  redis:
    image: redis:7-alpine
    container_name: wep_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  # Backend и Frontend будут добавлены после проектирования схемы деплоя
  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   ...
  
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   ...

volumes:
  postgres_data:
    driver: local

networks:
  wep_network:
    driver: bridge
