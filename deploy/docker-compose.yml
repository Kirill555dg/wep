version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wep_password}
      POSTGRES_DB: ${POSTGRES_DB:-wep_education}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wep_user} -d ${POSTGRES_DB:-wep_education}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

  minio:
    image: minio/minio:latest
    container_name: wep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wep_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  wep_network:
    driver: bridge
