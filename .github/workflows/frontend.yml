name: Frontend CI/CD

on:
  push:
    branches:
      - prksp_coursework
    paths:
      - 'frontend/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.prod.yml'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/test-constructor-frontend:latest

      - name: Telegram notify
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Skipping Telegram notification: set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository secrets."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode text="Frontend CI/CD: image pushed to Docker Hub. Tag: ${{ secrets.DOCKER_USERNAME }}/test-constructor-frontend:latest."
